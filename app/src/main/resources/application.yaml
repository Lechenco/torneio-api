spring:
  application:
    name: tier

management.endpoints.web.exposure.include: "*"
management.endpoint.health.show-details: always

management.health.diskspace.enabled: false
management.health.circuitbreakers.enabled: true
management.health.ratelimiters.enabled: false

info:
  name: ${spring.application.name}
  description: resilience4j demo
  environment: ${spring.profiles.active}
  version: 0.0.1

management.metrics.tags.application: ${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests: true
management.metrics.distribution.percentiles-histogram.resilience4j.circuitbreaker.calls: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10000
        failureRateThreshold: 60
        eventConsumerBufferSize: 2
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        recordExceptions:
          - io.github.lechenco.tier.exceptions.OpenCircuitBreakerException

aws:
  dyanmodb:
    endpoint: ${DYNAMO_ENDPOINT:http://localhost:4566}
    region: us-east-1
    accessKey: ${AWS_ACCESS_KEY:test}
    secretKey: ${AWS_SECRET_KEY:test}
